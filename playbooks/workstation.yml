---
# ============================================================================
# Master provisioning playbook -- b08x.workstation
#
# Layer 1 only: root-owned, identical for every user of the machine.
# Layer 2 ($HOME) is yadm's. Layer 3 (runtimes) belongs to each project.
# ============================================================================

- name: Provision a Pop!_OS / System76 workstation
  hosts: workstations
  gather_facts: true

  pre_tasks:
    - name: Show what is about to run
      ansible.builtin.debug:
        msg:
          - "b08x.workstation -- Layer 1 provisioning"
          - "Host:         {{ inventory_hostname }}"
          - "Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_os_family }})"
          - "Target user:  {{ workstation_user | default('UNSET') }}"
          - "Host CUDA:    {{ hardware_install_host_cuda | default(false) }}"
          - "Docker:       {{ containers_install_docker | default(false) }}"
      tags: [always]

    - name: Require a Debian-family distribution
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: >-
          {{ inventory_hostname }} reports {{ ansible_distribution }}
          {{ ansible_distribution_version }} (family {{ ansible_os_family }}).
          This collection is APT-only. If this is gir, it has not been
          reinstalled with Pop!_OS yet.
        success_msg: "{{ ansible_distribution }} {{ ansible_distribution_version }} accepted."
      tags: [always]

    - name: Require a target user
      ansible.builtin.assert:
        that:
          - workstation_user is defined
          - workstation_user | length > 0
        fail_msg: Set workstation_user in inventory/group_vars/workstations.yml.
      tags: [always]

  roles:
    - role: base
      tags: [base, system, apt]

    - role: hardware
      tags: [hardware, system76, nvidia, bootloader]

    - role: desktop
      tags: [desktop, cosmic, fonts, audio]

    - role: containers
      tags: [containers, podman, docker]

    - role: dotfiles
      tags: [dotfiles, yadm, user]

  post_tasks:
    - name: Check whether a reboot is pending
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: workstation_reboot_required
      tags: [always]

    - name: Summarise
      ansible.builtin.debug:
        msg: >-
          {{
            ['Layer 1 provisioning complete.']
            + (['A reboot is required: graphics mode or kernel arguments changed.']
               if workstation_reboot_required.stat.exists else [])
            + ['Next: confirm the yadm bootstrap ran, then set up per-project environments.']
          }}
      tags: [always]
