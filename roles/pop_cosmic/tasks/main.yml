---
# ============================================================================
# Role: pop_cosmic
# Purpose: COSMIC Desktop Environment, Pop!_Shell window tiling, & Fonts
# ============================================================================

- name: Install Monospace Engineering and UI Fonts
  become: true
  ansible.builtin.apt:
    name: "{{ pop_os_packages.fonts }}"
    state: present
  tags: ["fonts", "desktop"]

- name: Ensure Pop!_Shell Tiling Extension and Audio production components are ready
  become: true
  ansible.builtin.apt:
    name: "{{ pop_os_packages.audio_media }}"
    state: present
  tags: ["audio", "pipewire", "media"]

- name: Deploy PAM security limits for low-latency audio engineering (rtprio/memlock)
  become: true
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-pipewire-realtime.conf
    content: |
      # Low-latency audio permissions for user groups
      @audio    - rtprio  95
      @audio    - memlock unlimited
      @realtime - rtprio  95
      @realtime - memlock unlimited
    mode: "0644"
  tags: ["pipewire", "audio", "limits"]

- name: Configure PipeWire real-time threading privileges (rtkit)
  become: true
  ansible.builtin.systemd:
    name: rtkit-daemon.service
    enabled: true
    state: started
  ignore_errors: true
  tags: ["pipewire", "audio", "rtkit"]
