---
- name: Ensure Hermes data directory exists
  ansible.builtin.file:
    path: /opt/ai/data/hermes
    state: directory
    owner: ai-svc
    group: ai-svc
    mode: "0755"

- name: Deploy Hermes Secrets (Vault)
  ansible.builtin.template:
    src: hermes.env.j2
    dest: /opt/ai/config/hermes.env
    backup: true
    owner: root
    group: ai-svc
    mode: "0640"
  notify: ai_hermes restart hermes

- name: Deploy Hermes Gateway Quadlet
  ansible.builtin.template:
    src: hermes-gateway.container.j2
    dest: /etc/containers/systemd/hermes-gateway.container
    backup: true
    mode: "0644"
  notify: ai_hermes restart hermes

- name: Deploy Hermes Dashboard Quadlet
  ansible.builtin.template:
    src: hermes-dashboard.container.j2
    dest: /etc/containers/systemd/hermes-dashboard.container
    backup: true
    mode: "0644"
  notify: ai_hermes restart hermes

- name: Enable and start Hermes services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - hermes-gateway.service
    - hermes-dashboard.service

- name: Execute backup
  ansible.builtin.include_tasks: backup.yml
  tags: [never, backup]

- name: Execute restore
  ansible.builtin.include_tasks: restore.yml
  tags: [never, restore]
