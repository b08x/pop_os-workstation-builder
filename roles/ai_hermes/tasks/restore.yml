---
- name: Assert archive variable is provided
  ansible.builtin.assert:
    that:
      - ai_hermes_archive is defined
    fail_msg: "Please provide ai_hermes_archive (e.g. -e ai_hermes_archive=/opt/ai/backups/hermes_2026.tar.gz)"

- name: Stop services for restore
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop: ["hermes-gateway.service", "hermes-dashboard.service"]
  failed_when: false

- name: Extract archive to root
  ansible.builtin.unarchive:
    src: "{{ ai_hermes_archive }}"
    dest: /
    remote_src: true

- name: Start services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
  loop: ["hermes-gateway.service", "hermes-dashboard.service"]
  failed_when: false
