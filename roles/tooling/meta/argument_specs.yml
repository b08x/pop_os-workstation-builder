---
argument_specs:
  main:
    short_description: User-scope CLI tooling declared in host_vars.
    description:
      - Installs the CLI tools named in tooling_uv_tools into the target
        user's home.
      - The list is per-host inventory data, not a dotfile. yadm is scoped to
        authored content; a version-pinned package list is a description of
        installs. See docs/ANSIBLE-AND-YADM.md.
      - Needs no root -- become_user reaches $HOME. No ordering dependency on
        the dotfiles role.
      - Proof of concept. uv only. See docs/TOOLING-ROLE-PROOF.md.
    options:
      tooling_manage:
        type: bool
        required: false
        default: true
        description: Master switch for the role.
      tooling_user:
        type: str
        required: true
        description: Login name whose $HOME receives the tools.
      tooling_manage_uv:
        type: bool
        required: false
        default: true
        description: Manage uv and the Python CLI tools it installs.
      tooling_uv_version:
        type: str
        required: false
        default: "0.12.3"
        description:
          - uv release to install. Pinned deliberately.
          - Available Python downloads are frozen per uv release, so this also
            decides which CPythons uv can install.
      tooling_uv_asset:
        type: str
        required: false
        description: Release asset filename for this platform.
      tooling_uv_base_url:
        type: str
        required: false
        description: Base URL for uv release downloads.
      tooling_uv_checksum:
        type: str
        required: false
        description:
          - sha256 of the uv asset. Empty downloads unverified, with a warning.
      tooling_uv_install_dir:
        type: str
        required: false
        default: .local/bin
        description: Destination for the uv binaries, relative to home.
      tooling_uv_tools:
        type: list
        elements: dict
        required: false
        default: []
        description:
          - Tools to install. Per-host data; declare in host_vars.
          - Each entry takes name, plus either version (PyPI pin) or
            git and rev. Optional with is a list of extra dependencies.
        options:
          name:
            type: str
            required: true
            description: Package name, and the key compared against uv tool list.
          version:
            type: str
            required: false
            description: PyPI version pin. Omit for git-sourced entries.
          git:
            type: str
            required: false
            description: Repository URL, for tools not installed from PyPI.
          rev:
            type: str
            required: false
            description: Tag, branch, or commit to install when git is set.
          with:
            type: list
            elements: str
            required: false
            description: Extra dependencies injected into the tool environment.
      tooling_uv_state:
        type: str
        required: false
        default: present
        choices: [present, latest]
        description:
          - present installs the pinned version and leaves it alone.
          - latest re-resolves on every run, which makes provisioning
            non-deterministic. Updating should be a separate deliberate act.
      tooling_uv_torch_backend:
        type: str
        required: false
        default: auto
        description:
          - Value for UV_TORCH_BACKEND on every uv invocation.
          - auto reads the installed driver and falls back to CPU-only wheels.
            Without it, any tool that transitively depends on torch pulls the
            Linux default CUDA build.
      tooling_uv_python_preference:
        type: str
        required: false
        default: system
        choices: [system, managed, only-system, only-managed]
        description:
          - Value for UV_PYTHON_PREFERENCE.
          - system prefers the distribution interpreter. Note uv's own default
            is managed, which prefers uv's interpreters instead.
