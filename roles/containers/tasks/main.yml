---
# ============================================================================
# Role: containers
# Purpose: Podman (default) and Docker (opt-in), plus hardware group access
# ============================================================================

- name: Assert a target user was supplied
  ansible.builtin.assert:
    that:
      - containers_user is defined
      - containers_user | length > 0
    fail_msg: >-
      containers_user must be set. Define it in group_vars so group membership
      and lingering are applied to a real account rather than whichever user
      Ansible happened to connect as.
  tags: [always]

- name: Install Podman
  when: containers_install_podman | bool
  become: true
  ansible.builtin.apt:
    name: "{{ containers_podman_packages }}"
    state: present
  tags: [packages, podman, containers]

- name: Install Docker
  when: containers_install_docker | bool
  become: true
  ansible.builtin.apt:
    name: "{{ containers_docker_packages }}"
    state: present
  notify: containers reload systemd
  tags: [packages, docker, containers]

- name: Enable the Docker daemon
  when: containers_install_docker | bool
  become: true
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started
  tags: [systemd, docker, containers]

- name: Grant hardware and container group membership
  become: true
  ansible.builtin.user:
    name: "{{ containers_user }}"
    groups: "{{ containers_user_groups + (['docker'] if containers_install_docker | bool else []) }}"
    append: true
  tags: [groups, permissions, users, containers]

- name: Enable systemd lingering for rootless containers
  when:
    - containers_enable_lingering | bool
    - containers_install_podman | bool
  become: true
  ansible.builtin.command:
    argv: [loginctl, enable-linger, "{{ containers_user }}"]
  args:
    creates: "/var/lib/systemd/linger/{{ containers_user }}"
  tags: [systemd, lingering, podman, containers]

# --------------------------------------------------------------------------
# GPU readiness
#
# The hardware role generates the CDI spec and runs before this one. This is
# a check, not a second implementation -- the failure it catches is a machine
# that has podman and an NVIDIA GPU but no way to join them, which otherwise
# only surfaces the first time a container silently can't see the device.
# --------------------------------------------------------------------------
- name: Verify GPU containers are actually usable
  when:
    - containers_install_podman | bool
    - containers_verify_gpu | bool
  tags: [gpu, cdi, podman, containers, verify]
  block:

    - name: Look for an NVIDIA GPU
      ansible.builtin.command:
        argv: [nvidia-smi, --query-gpu=name, "--format=csv,noheader"]
      register: containers_gpu_present
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Look for the CDI specification
      ansible.builtin.stat:
        path: "{{ containers_cdi_spec_path }}"
      register: containers_cdi_spec

    - name: Report a GPU with no CDI specification
      when:
        - containers_gpu_present.rc == 0
        - not containers_cdi_spec.stat.exists
      ansible.builtin.debug:
        msg: |
          {{ containers_gpu_present.stdout | trim }} is present and podman is
          installed, but {{ containers_cdi_spec_path }} does not exist.
          GPU containers will fail with "no such device".
          Fix: ansible-playbook playbooks/workstation.yml --tags cdi

    - name: Report GPU containers as ready
      when:
        - containers_gpu_present.rc == 0
        - containers_cdi_spec.stat.exists
      ansible.builtin.debug:
        msg: |
          GPU containers ready -- {{ containers_gpu_present.stdout | trim }}.
          Smoke test:
            podman run --rm --device nvidia.com/gpu=all \
              nvidia/cuda:13.0-base-ubuntu24.04 nvidia-smi
