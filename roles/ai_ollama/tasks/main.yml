---
- name: Ensure Ollama data directory exists
  ansible.builtin.file:
    path: /opt/ai/data/ollama
    state: directory
    owner: ai-svc
    group: ai-svc
    mode: "0755"

- name: Deploy Ollama Quadlet
  ansible.builtin.template:
    src: ollama.container.j2
    dest: /etc/containers/systemd/ollama.container
    mode: "0644"
  notify: restart ollama

- name: Enable and start Ollama
  ansible.builtin.systemd:
    name: ollama.service
    state: started
    enabled: true
    daemon_reload: true

- name: Execute backup
  ansible.builtin.include_tasks: backup.yml
  tags: [never, backup]

- name: Execute restore
  ansible.builtin.include_tasks: restore.yml
  tags: [never, restore]
