---
# ============================================================================
# Role defaults: hardware
# System76 daemons, GPU driver, and systemd-boot kernel parameters.
#
# Sourced from System76 support docs:
#   https://system76.com/support/articles/system76-driver
#   https://system76.com/support/articles/graphics-switch-pop
#   https://system76.com/support/articles/system76-software
#   https://system76.com/support/articles/cuda
# ============================================================================

hardware_install_system76: true

# Pop!_OS ships the System76 repository and these packages by default, so on a
# stock Pop install every one of these is already present and the role is a
# no-op. The list matters when running against plain Ubuntu, or after someone
# has removed something by hand.
hardware_system76_packages:
  - pop-desktop
  - system76-driver
  - system76-power
  - system76-scheduler
  - system76-firmware
  - system76-firmware-daemon
  - firmware-manager
  - linux-system76

hardware_system76_services:
  - system76-power.service
  - system76-scheduler.service
  - system76-firmware-daemon.service

# system76-power cannot start while power-profiles-daemon holds the same D-Bus
# territory. GNOME installs power-profiles-daemon by default, and the symptom
# is com.system76.PowerDaemon.service staying dead despite being enabled.
# System76 support prescribes masking it.
hardware_mask_power_profiles_daemon: true

# The firmware daemon requires the invoking user to be in `adm`.
hardware_firmware_admin_group: adm

# --- GPU -------------------------------------------------------------------
hardware_install_nvidia: true

# COSMIC is designed to run in hybrid mode and offers no graphical switcher.
# Valid: integrated | nvidia | hybrid | compute
hardware_graphics_mode: hybrid

# System76 packages and validates the proprietary driver against their kernel.
# Do NOT add nvidia-driver-<NNN> here. That is a second, competing source for
# a driver this package already provides, and which of the two wins is
# resolution-order luck rather than intent. Keep exactly one source.
hardware_nvidia_packages:
  - system76-driver-nvidia

# Container-side GPU access. This is the supported path for CUDA workloads.
hardware_nvidia_container_packages:
  - nvidia-container-toolkit
  - libnvidia-container-tools

# Generate /etc/cdi/nvidia.yaml so containers can request the GPU.
#
# Installing nvidia-container-toolkit gets you the tooling; the CDI spec is
# what actually makes `podman run --device nvidia.com/gpu=all` resolve. CDI is
# the rootless-friendly path and is why this works without the Docker daemon.
#
# The spec records driver library paths, so it is invalidated by every driver
# upgrade. Where nvidia-cdi-refresh ships with the toolkit the role enables it
# and lets it own regeneration; where it does not, re-run with --tags cdi
# after any driver change.
hardware_generate_cdi_spec: true
hardware_cdi_spec_path: /etc/cdi/nvidia.yaml

# nvidia-ctk discovery mode. `auto` picks between nvml and wsl by inspecting
# the host, which is right for bare metal and for a passthrough guest alike.
hardware_cdi_mode: auto

# Image tag quoted in the post-generation smoke-test hint. Purely cosmetic --
# it appears in a debug message and pulls nothing.
hardware_cdi_smoke_test_tag: "13.0-base-ubuntu24.04"

# Host CUDA toolkit. Default OFF, deliberately, for two reasons:
#
#   1. System76: "Basic CUDA runtime functionality is installed automatically
#      with the NVIDIA driver (in the libnvidia-compute-* and
#      nvidia-compute-utils-* packages)." Check the ceiling with nvidia-smi.
#      They also warn nvidia-cuda-toolkit is Ubuntu-maintained and often lags
#      the version the driver actually supports.
#   2. A prior audit of this workstation measured ~21 GB of overlapping CUDA
#      and torch runtime, caused by a host toolkit layered under user-space
#      pip installs of the same libraries.
#
# Need a specific toolkit version? Use an nvidia/cuda container image with
# nvidia-container-toolkit rather than flipping this on.
hardware_install_host_cuda: false
hardware_host_cuda_packages:
  - nvidia-cuda-toolkit

# --- Boot ------------------------------------------------------------------
# Pop!_OS is systemd-boot on UEFI; kernel args go through kernelstub, not GRUB.
hardware_manage_kernel_params: true
hardware_kernel_params:
  - "nvidia-drm.modeset=1"
  - "quiet"
  - "loglevel=3"

# System76's CUDA article adds systemd.unified_cgroup_hierarchy=0 for the
# Docker + NVIDIA Container Toolkit path. That forces the system back to
# cgroups v1, which breaks rootless Podman resource limits on noble. Left out
# on purpose. Add it here only if you commit to Docker as the GPU runtime.
