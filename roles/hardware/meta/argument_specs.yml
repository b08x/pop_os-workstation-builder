---
argument_specs:
  main:
    short_description: System76 hardware enablement and boot parameters.
    description:
      - Installs System76 daemons and the vendor NVIDIA driver, sets the
        hybrid graphics profile, and manages kernel arguments via kernelstub.
      - Host CUDA is off by default; use a container instead.
    options:
      hardware_install_system76:
        type: bool
        required: false
        default: true
        description: Install System76 vendor packages. Set false on non-System76 hardware.
      hardware_system76_packages:
        type: list
        elements: str
        required: false
        description: System76 vendor APT packages.
      hardware_system76_services:
        type: list
        elements: str
        required: false
        description: System76 systemd units to enable, if present after install.
      hardware_install_nvidia:
        type: bool
        required: false
        default: true
        description: Install the vendor NVIDIA driver and container toolkit.
      hardware_user:
        type: str
        required: false
        description: Login name added to the firmware admin group.
      hardware_mask_power_profiles_daemon:
        type: bool
        required: false
        default: true
        description:
          - Mask power-profiles-daemon so system76-power can start.
          - GNOME installs it by default and the two conflict.
      hardware_firmware_admin_group:
        type: str
        required: false
        default: adm
        description: Group the System76 firmware daemon requires for its callers.
      hardware_graphics_mode:
        type: str
        required: false
        default: hybrid
        choices: [integrated, nvidia, hybrid, compute]
        description:
          - Graphics profile applied via system76-power.
          - COSMIC is designed around hybrid and has no graphical switcher.
      hardware_nvidia_packages:
        type: list
        elements: str
        required: false
        description: NVIDIA driver packages. Keep this to a single source.
      hardware_nvidia_container_packages:
        type: list
        elements: str
        required: false
        description: Packages granting containers access to the GPU.
      hardware_generate_cdi_spec:
        type: bool
        required: false
        default: true
        description:
          - Generate the CDI specification that lets containers request the GPU.
          - Without it, nvidia-container-toolkit is installed but
            "podman run --device nvidia.com/gpu=all" fails.
      hardware_cdi_spec_path:
        type: str
        required: false
        default: /etc/cdi/nvidia.yaml
        description: Destination for the generated CDI specification.
      hardware_cdi_mode:
        type: str
        required: false
        default: auto
        choices: [auto, nvml, wsl, management, gds, mofed, csv]
        description: Discovery mode passed to "nvidia-ctk cdi generate".
      hardware_cdi_smoke_test_tag:
        type: str
        required: false
        description:
          - nvidia/cuda image tag quoted in the post-generation hint.
          - Cosmetic; appears in a debug message and pulls nothing.
      hardware_install_host_cuda:
        type: bool
        required: false
        default: false
        description:
          - Install the CUDA toolkit onto the host filesystem.
          - Off by default. The driver ships a basic CUDA runtime already, and a
            host toolkit layered under user-space installs duplicates it. Prefer
            an nvidia/cuda container image with nvidia-container-toolkit.
      hardware_host_cuda_packages:
        type: list
        elements: str
        required: false
        description: Host CUDA packages, used only when hardware_install_host_cuda is true.
      hardware_manage_kernel_params:
        type: bool
        required: false
        default: true
        description: Manage kernel arguments through kernelstub.
      hardware_kernel_params:
        type: list
        elements: str
        required: false
        description: Kernel arguments to ensure are present in the boot entry.
