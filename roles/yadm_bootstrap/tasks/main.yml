# SPDX-License-Identifier: MIT-0
---
# ============================================================================
# Role: yadm_bootstrap (Layer 2 User Identity Handoff)
# Purpose: Clones user dotfiles and executes declarative tool bootstrapping
# ============================================================================

- name: Verify yadm installation status
  ansible.builtin.command: "which yadm"
  register: yadm_path
  changed_when: false
  failed_when: false
  tags: ["yadm", "check"]

- name: Install yadm package via APT if not found
  when: yadm_path.rc != 0
  become: true
  ansible.builtin.apt:
    name: yadm
    state: present
  tags: ["yadm", "install"]

- name: Check if yadm repository has already been cloned for user
  become: false
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.local/share/yadm/repo.git"
  register: yadm_repo_stat
  tags: ["yadm", "clone"]

- name: Clone user dotfiles via yadm (Layer 2 User Identity)
  when: not yadm_repo_stat.stat.exists and yadm_dotfiles_repo is defined
  become: false
  ansible.builtin.command: "yadm clone --bootstrap {{ yadm_dotfiles_repo }}"
  args:
    creates: "{{ ansible_env.HOME }}/.local/share/yadm/repo.git"
  register: yadm_clone
  failed_when: false
  # Expected failure: SSH passphrase prompt, missing deploy key, or network timeout.
  # The debug task below surfaces the outcome; idempotency is handled by 'creates:'.
  tags: ["yadm", "clone", "bootstrap"]

- name: Warn if yadm clone did not succeed
  when:
    - yadm_clone is defined
    - yadm_clone.rc is defined
    - yadm_clone.rc != 0
  ansible.builtin.debug:
    msg: |
      WARNING: yadm clone returned rc={{ yadm_clone.rc }}.
      This is expected on first run if SSH keys are not yet configured.
      {{ yadm_clone.stderr | default('') | truncate(200) }}
      Re-run this role after configuring SSH access to your dotfiles repo.
  tags: ["yadm", "clone", "warning"]

- name: Display note regarding Layer 2 declarative tooling
  ansible.builtin.debug:
    msg: |
      === Layer 2 Handoff Complete ===
      Per our 3-Layer governance architecture, generative AI tools (gemini-cli, claude-code),
      Rust binaries, and global npm packages are NOT installed as root by Ansible.
      Ensure your yadm bootstrap script executes against ~/.config/tooling/* manifests!
  tags: ["yadm", "notice"]
