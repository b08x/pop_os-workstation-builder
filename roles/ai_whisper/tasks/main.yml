---
- name: Deploy Whisper Dockerfile (Intel OneAPI)
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: /opt/ai/build/whisper/Dockerfile
    mode: "0644"

- name: Build Whisper image on host
  containers.podman.podman_image:
    name: localhost/whisper-server
    tag: local
    path: /opt/ai/build/whisper/
    build:
      cache: true
      force_rm: true

- name: Deploy Whisper Quadlet
  ansible.builtin.template:
    src: whisper.container.j2
    dest: /etc/containers/systemd/whisper.container
    mode: "0644"
  notify: restart whisper

- name: Enable and start Whisper
  ansible.builtin.systemd:
    name: whisper.service
    state: started
    enabled: true
    daemon_reload: true
