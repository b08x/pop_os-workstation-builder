---
- name: Assert archive variable is provided
  ansible.builtin.assert:
    that:
      - ai_whisper_archive is defined
    fail_msg: "Please provide ai_whisper_archive (e.g. -e ai_whisper_archive=/opt/ai/backups/whisper_2026.tar.gz)"

- name: Stop services for restore
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop: ["whisper.service"]
  failed_when: false

- name: Extract archive to root
  ansible.builtin.unarchive:
    src: "{{ ai_whisper_archive }}"
    dest: /
    remote_src: true

- name: Start services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
  loop: ["whisper.service"]
  failed_when: false
