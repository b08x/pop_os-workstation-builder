---
# ============================================================================
# Role defaults: dotfiles
# The Layer 1 -> Layer 2 handoff. This role installs yadm and clones the
# dotfiles repo. It does not manage the contents of $HOME -- yadm does.
# ============================================================================

dotfiles_manage: true

# SSH URL of the yadm repository. Empty means skip the clone entirely.
dotfiles_repo: ""

# Run the repo's own bootstrap script after cloning.
dotfiles_run_bootstrap: true

# Fail the play when the clone does not succeed. Default false because the
# first run on a fresh machine legitimately has no SSH key yet.
dotfiles_require_clone: false

dotfiles_packages:
  - yadm
