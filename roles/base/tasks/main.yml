---
# ============================================================================
# Role: base
# Purpose: timezone, core dump policy, APT tuning, system CLI toolchain
# ============================================================================

- name: Set system timezone
  become: true
  community.general.timezone:
    name: "{{ base_timezone }}"
  tags: [timezone, base]

- name: Configure core dump policy
  when: base_disable_coredumps | bool
  become: true
  tags: [coredumps, base]
  block:
    - name: Create systemd coredump drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/coredump.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy coredump disable drop-in
      ansible.builtin.copy:
        dest: /etc/systemd/coredump.conf.d/99-disable-coredumps.conf
        content: |
          # Managed by b08x.workstation.base -- do not edit by hand.
          [Coredump]
          Storage=none
          ProcessSizeMax=0
        owner: root
        group: root
        mode: "0644"
      notify: base reload systemd

- name: Configure APT behaviour
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99-workstation-optimizations
    content: |
      // Managed by b08x.workstation.base -- do not edit by hand.
      APT::Get::AutomaticRemove "true";
      APT::Install-Recommends "{{ base_apt_install_recommends | bool | lower }}";
      APT::Install-Suggests "{{ base_apt_install_suggests | bool | lower }}";
      Acquire::http::Pipeline-Depth "{{ base_apt_pipeline_depth }}";
      Acquire::Languages "none";
    owner: root
    group: root
    mode: "0644"
  tags: [apt, base]

- name: Upgrade the base system
  when: base_apt_upgrade != "no"
  become: true
  ansible.builtin.apt:
    upgrade: "{{ base_apt_upgrade }}"
    update_cache: true
    cache_valid_time: "{{ base_apt_cache_valid_time }}"
  tags: [apt, base, upgrade]

- name: Configure NodeSource repository for Node.js
  become: true
  tags: [apt, nodejs, base]
  block:
    - name: Ensure APT keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download NodeSource GPG signing key
      ansible.builtin.get_url:
        url: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
        dest: /etc/apt/keyrings/nodesource.asc
        owner: root
        group: root
        mode: "0644"

    - name: Configure NodeSource deb822 repository
      ansible.builtin.deb822_repository:
        name: nodesource
        types: [deb]
        uris:
          - "https://deb.nodesource.com/node_{{ base_nodejs_major_version }}.x"
        suites:
          - nodistro
        components:
          - main
        signed_by: /etc/apt/keyrings/nodesource.asc
        state: present
        enabled: true

- name: Install the system CLI toolchain
  become: true
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ base_apt_cache_valid_time }}"
  tags: [packages, cli, base]

# --------------------------------------------------------------------------
# System Tuning (Memory & ZRAM)
# --------------------------------------------------------------------------

- name: Configure system tuning sysctls
  become: true
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ base_sysctls | dict2items }}"
  tags: [tuning, sysctl, memory, base]

- name: Configure zram-generator with zstd and high priority
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/zram-generator.conf
    content: |
      # Managed by b08x.workstation.base -- do not edit by hand.
      [zram0]
      zram-size = min(ram, 8192)
      compression-algorithm = zstd
      swap-priority = 100
    owner: root
    group: root
    mode: "0644"
  notify:
    - base reload systemd
    - base restart zram0
  tags: [tuning, zram, swap, base]
