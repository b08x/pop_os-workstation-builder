---
- name: Reload systemd daemon
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: base reload systemd

- name: Restart zram0
  become: true
  ansible.builtin.systemd_service:
    name: systemd-zram-setup@zram0.service
    state: restarted
    daemon_reload: true
  listen: base restart zram0
