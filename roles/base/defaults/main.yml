---
# ============================================================================
# Role defaults: base
# Layer 1 only. Nothing here may touch $HOME or install a language runtime.
# ============================================================================

base_timezone: "America/New_York"

# Node.js major version from NodeSource repository (e.g. 20, 22)
base_nodejs_major_version: "22"

# Disable core dumps: saves storage and keeps PII out of crash traces.
base_disable_coredumps: true

# Passed to ansible.builtin.apt `upgrade:`. Use "no" to skip the upgrade pass.
base_apt_upgrade: "dist"
base_apt_cache_valid_time: 3600

# Written to /etc/apt/apt.conf.d/99-workstation-optimizations
base_apt_install_recommends: true
base_apt_install_suggests: false
base_apt_pipeline_depth: 5

# System-scope CLI and build toolchain. Anything a *user* wants belongs in
# yadm-managed manifests (Layer 2), not here.
