---
- name: Ensure Dify data directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0755"
  loop:
    - { path: /opt/ai/data/dify-storage, owner: "1001" } # Dify runs as 1001

- name: Deploy Dify Config (Vault)
  ansible.builtin.template:
    src: dify.env.j2
    dest: /opt/ai/config/dify.env
    backup: true
    owner: root
    group: ai-svc
    mode: "0640"
  notify: ai_dify restart

- name: Deploy Dify Quadlets
  ansible.builtin.template:
    src: "{{ item }}.container.j2"
    dest: "/etc/containers/systemd/{{ item }}.container"
    backup: true
    mode: "0644"
  loop:
    - dify-api
    - dify-worker
    - dify-web
    - dify-sandbox
  notify: ai_dify restart

- name: Enable and start Dify services
  ansible.builtin.systemd:
    name: "{{ item }}.service"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - dify-sandbox
    - dify-api
    - dify-worker
    - dify-web

- name: Execute backup
  ansible.builtin.include_tasks: backup.yml
  tags: [never, backup]

- name: Execute restore
  ansible.builtin.include_tasks: restore.yml
  tags: [never, restore]
